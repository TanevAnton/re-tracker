name: Component tracker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/price-tracker/**'
      - '.github/workflows/price-tracker.yml'
  pull_request:
    paths:
      - 'apps/price-tracker/**'
      - '.github/workflows/price-tracker.yml'

# Daily collection moved to verified macOS launchd. This workflow only tests code.
concurrency:
  group: component-prices-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: apps/price-tracker
      - run: python -m unittest discover -s tests -v
        working-directory: apps/price-tracker
