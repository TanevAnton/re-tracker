name: Telegram sender tests
on:
  push:
    paths: ['scripts/telegram_report.py', 'tests/test_telegram_report.py', '.github/workflows/telegram-ci.yml']
  pull_request:
    paths: ['scripts/telegram_report.py', 'tests/test_telegram_report.py', '.github/workflows/telegram-ci.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_telegram_report.py' -v
